version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stravabrowser-backend
    restart: unless-stopped
    ports:
      - "1300:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - FRONTEND_URL=http://localhost:180
    env_file:
      - ./backend/.env
    volumes:
      # Persist SQLite database
      - strava-data:/app/data
    networks:
      - strava-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stravabrowser-frontend
    restart: unless-stopped
    ports:
      - "180:80"
    depends_on:
      - backend
    networks:
      - strava-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  strava-network:
    driver: bridge

volumes:
  strava-data:
    driver: local
